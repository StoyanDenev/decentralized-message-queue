\* TLC configuration for HelloHandshake.tla (D2 remodel, 2026-07-31)
\* Model: WireVersions = {1, 2}, ChainIds = {"chain_a", "chain_b"},
\*        NodeIds = {"n1", "n2", "n3"}, MaxHandshakes = 3.
\*
\* WireVersions = {1, 2}:
\*   - 1 = kWireVersionBinary (the single shipped wire format).
\*   - 2 = a FUTURE advertised version. D2 made wire_version an
\*     advertisement-only field: admission is version-blind, so TLC
\*     must reach ACCEPT outcomes for wv=2 entries exactly as for
\*     wv=1. This is the negative exercise of the deleted
\*     negotiation gate — if anyone re-introduces a version
\*     admission predicate without remodeling the spec, the
\*     documented advertisement-only property no longer matches
\*     the state machine and the remodel discipline (spec tracks
\*     shipped code) is violated.
\*
\* ChainIds = {"chain_a", "chain_b"}: exercises both the matching
\* case (ACCEPT reachable) and the mismatch case (REJECT via
\* ProcessHandshake's catch-all or the dedicated
\* RejectMismatchedChain action); INV_ChainIdAgreement holds because
\* cid_match gates the ACCEPT branch.
\*
\* NodeIds = {"n1", "n2", "n3"}: the three-way handshake triangle
\* plus the self-loop rejection (`from /= to`), exposing
\* INV_AcceptedPeersSubsetHandshakes across multi-peer
\* interleavings.
\*
\* MaxHandshakes = 3: minimum bound fitting the full triangle in one
\* behavior; Stutter pins the bounded state space once all entries
\* resolve; PROP_EventualHandshakeResolution witnesses resolution
\* under the WF_vars fairness clauses.

CONSTANTS
    WireVersions  = {1, 2}
    ChainIds      = {"chain_a", "chain_b"}
    NodeIds       = {"n1", "n2", "n3"}
    MaxHandshakes = 3

SPECIFICATION Spec

INVARIANTS
    TypeOK
    INV_ChainIdAgreement
    INV_AcceptedPeersSubsetHandshakes

PROPERTIES
    PROP_EventualHandshakeResolution
    PROP_NoSilentAcceptOnChainMismatch
