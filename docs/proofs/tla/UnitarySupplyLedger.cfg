\* TLC configuration for UnitarySupplyLedger.tla
\* Model: 3 domains {a, b, c}, GenesisTotal = 12, MaxDelta = 2,
\* MaxSteps = 5.
\*
\* This is small enough for TLC to exhaust in ~1 minute while still
\* exercising every one of the TEN apply-layer actions (Transfer /
\* StakeLock / StakeUnlock / MintSubsidy / InboundReceipt / OutboundDebit /
\* SlashStake / Shield / Unshield / ConfidentialTransfer) across realistic
\* interleavings. MaxDelta was tightened from 3 to 2 when the three §3.22
\* shield actions + the acc_shielded dimension were added, to keep the
\* expanded state space inside the model-check gate's per-config timeout
\* while preserving the 5-step (depth-6) interleaving.
\*
\* GenesisTotal = 12 with |Domains| = 3 gives an exact equal allocation
\* of 4 per domain at Init (ConfigOK requires GenesisTotal % |Domains| =
\* 0, so the genesis sum is exactly 12 with no dust). The genesis_total_
\* pin at chain.cpp:934 is the source analogue.
\*
\* MaxDelta = 2 keeps each per-action amount in 1..2, so a single
\* MintSubsidy / InboundReceipt / Unshield / ConfidentialTransfer can grow
\* LiveSupply by at most 2 and a single SlashStake / OutboundDebit / Shield
\* can shrink it by at most 2. With MaxSteps = 5, the maximum cumulative
\* mint is 2 * 2 * 5 = 20 (subsidy + inbound), bounding every balance /
\* stake at GenesisTotal + 20 = 32 — the Inv_TypeOK ceiling. acc_shielded
\* is bounded by MaxDelta * MaxSteps = 10 (only Shield increments it).
\*
\* MaxSteps = 5 caps the action count. Five steps is enough to witness:
\*   - a StakeLock then SlashStake on the same domain (the burn path that
\*     removes value from the live pool via the locked component),
\*   - a MintSubsidy then OutboundDebit (a +subsidy followed by an
\*     -outbound, net-zero on the identity but both accumulators bumped),
\*   - a Shield then Unshield round-trip on one domain (value leaves the
\*     transparent sum into acc_shielded, then returns — the identity holds
\*     at BOTH the shielded intermediate state and after the round-trip),
\*   - a Shield whose acc_shielded persists to the terminal state, so the
\*     six-term identity is exercised with shielded > 0, not only at 0.
\* all while Inv_A1UnitarySupply holds at every intermediate state.
\*
\* Coverage matrix (one exhaustive trace within MaxSteps = 5):
\*   - Shield(a, 2)        -> balance[a]=2, acc_shielded=2          (step 1)
\*   - MintSubsidy(a, 2)   -> balance[a]=4, acc_subsidy=2           (step 2)
\*   - StakeLock(b, 2)     -> balance[b]=2, locked[b]=2             (step 3)
\*   - SlashStake(b, 1)    -> locked[b]=1, acc_slashed=1           (step 4)
\*   - OutboundDebit(c, 1) -> balance[c]=3, acc_outbound=1         (step 5)
\* End state: balances a=4 b=2 c=3 (=9), locked b=1 (=1), so
\* LiveSupply = 9 + 1 = 10, with acc_shielded=2 still in the pool. TLC
\* verifies the exact six-term identity
\*   LiveSupply + slashed + outbound + shielded = genesis + subsidy + inbound
\* at every reachable state (here: 10 + 1 + 1 + 2 = 12 + 2 + 0 = 14).
\*
\* Inv_A1UnitarySupply is the headline: verified across every reachable
\* state, the six-term ledger closes. The interleaving freedom in Next lets
\* TLC explore all orderings of the ten actions, so the identity is checked
\* under the full composition — not just the single canonical trace above.
\* Inv_AccumulatorsMonotone is checked over the FOUR monotone accumulators
\* only; acc_shielded is two-directional (Shield up, Unshield /
\* ConfidentialTransfer down) and is deliberately excluded (see spec T-U3).
\*
\* Inv_NoNegativeUnderflow guards the Nat-closure: every SlashStake /
\* OutboundDebit / Shield is gated on a sufficient locked / balance
\* pre-condition, and every Unshield / ConfidentialTransfer on acc_shielded
\* >= amt, so the three subtracted accumulator terms (slashed + outbound +
\* shielded) can never exceed the added terms, and the C++ uint64
\* subtractions at chain.cpp:1866-1892 cannot wrap.

CONSTANTS
    Domains      = {a, b, c}
    GenesisTotal = 12
    MaxDelta     = 2
    MaxSteps     = 5

SPECIFICATION Spec

INVARIANTS
    Inv_TypeOK
    Inv_A1UnitarySupply
    Inv_NoNegativeUnderflow
    Inv_LiveDecomposition

PROPERTIES
    Inv_AccumulatorsMonotone
    Prop_SupplyAlwaysCloses
    Prop_OnlyAccountedDeltas
